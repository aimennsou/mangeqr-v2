<!doctype html>
<html>
<head><meta charset="utf-8"><title>FF edge test</title></head>
<body style="margin:0;background:#161412;padding:40px;font-family:Arial">
  <div style="display:flex;gap:40px;flex-wrap:wrap">
    <!-- burger -->
    <div style="width:250px;height:200px;position:relative">
      <img src="burger.jpg" style="width:100%;height:100%;object-fit:cover;display:block;
        -webkit-mask-image:radial-gradient(ellipse 58% 58% at 50% 50%, #000 40%, rgba(0,0,0,.6) 66%, rgba(0,0,0,0) 86%);
        mask-image:radial-gradient(ellipse 58% 58% at 50% 50%, #000 40%, rgba(0,0,0,.6) 66%, rgba(0,0,0,0) 86%)">
      <div style="position:absolute;inset:0;pointer-events:none;background-image:
        radial-gradient(ellipse 62% 62% at 50% 50%, rgba(22,20,18,0) 55%, #161412 92%),
        linear-gradient(to top, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%),
        linear-gradient(to bottom, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%),
        linear-gradient(to left, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%),
        linear-gradient(to right, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%)"></div>
    </div>
    <!-- wrap -->
    <div style="width:250px;height:200px;position:relative">
      <img src="wrap.jpg" style="width:100%;height:100%;object-fit:cover;display:block;
        -webkit-mask-image:radial-gradient(ellipse 58% 58% at 50% 50%, #000 40%, rgba(0,0,0,.6) 66%, rgba(0,0,0,0) 86%);
        mask-image:radial-gradient(ellipse 58% 58% at 50% 50%, #000 40%, rgba(0,0,0,.6) 66%, rgba(0,0,0,0) 86%)">
      <div style="position:absolute;inset:0;pointer-events:none;background-image:
        radial-gradient(ellipse 62% 62% at 50% 50%, rgba(22,20,18,0) 55%, #161412 92%),
        linear-gradient(to top, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%),
        linear-gradient(to bottom, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%),
        linear-gradient(to left, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%),
        linear-gradient(to right, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%)"></div>
    </div>
    <!-- pizza -->
    <div style="width:250px;height:200px;position:relative">
      <img src="pizza.jpg" style="width:100%;height:100%;object-fit:cover;display:block;
        -webkit-mask-image:radial-gradient(ellipse 58% 58% at 50% 50%, #000 40%, rgba(0,0,0,.6) 66%, rgba(0,0,0,0) 86%);
        mask-image:radial-gradient(ellipse 58% 58% at 50% 50%, #000 40%, rgba(0,0,0,.6) 66%, rgba(0,0,0,0) 86%)">
      <div style="position:absolute;inset:0;pointer-events:none;background-image:
        radial-gradient(ellipse 62% 62% at 50% 50%, rgba(22,20,18,0) 55%, #161412 92%),
        linear-gradient(to top, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%),
        linear-gradient(to bottom, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%),
        linear-gradient(to left, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%),
        linear-gradient(to right, #161412 0%, rgba(22,20,18,.85) 10%, rgba(22,20,18,0) 30%)"></div>
    </div>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Générer le QR code">
  <defs>
    <clipPath id="n-card"><rect width="480" height="260" rx="14"/></clipPath>
    <style>.t{font-family:Georgia,serif}.s{font-family:system-ui,Arial,sans-serif}</style>
  </defs>
  <g clip-path="url(#n-card)">
    <rect width="480" height="260" fill="#faf7f2"/>
    <text x="28" y="42" class="t" font-size="22" fill="#1a1a1a">Menu numérique</text>
    <line x1="28" y1="56" x2="452" y2="56" stroke="#e7e1d6"/>

    <!-- QR card -->
    <rect x="150" y="74" width="180" height="120" rx="14" fill="#fff" stroke="#eee6d9"/>
    <!-- QR modules (static grid + finder squares) -->
    <g transform="translate(198,90)" fill="#1a1a1a">
      <rect x="0" y="0" width="24" height="24"/><rect x="4" y="4" width="16" height="16" fill="#fff"/><rect x="8" y="8" width="8" height="8" fill="#1a1a1a"/>
      <rect x="60" y="0" width="24" height="24"/><rect x="64" y="4" width="16" height="16" fill="#fff"/><rect x="68" y="8" width="8" height="8" fill="#1a1a1a"/>
      <rect x="0" y="60" width="24" height="24"/><rect x="4" y="64" width="16" height="16" fill="#fff"/><rect x="8" y="68" width="8" height="8" fill="#1a1a1a"/>
      <rect x="34" y="6" width="7" height="7"/><rect x="46" y="6" width="7" height="7"/><rect x="34" y="18" width="7" height="7"/>
      <rect x="40" y="34" width="7" height="7"/><rect x="52" y="40" width="7" height="7"/><rect x="30" y="46" width="7" height="7"/>
      <rect x="64" y="40" width="7" height="7"/><rect x="76" y="34" width="7" height="7"/><rect x="46" y="64" width="7" height="7"/>
      <rect x="60" y="60" width="7" height="7"/><rect x="72" y="72" width="7" height="7"/><rect x="60" y="76" width="7" height="7"/>
    </g>

    <!-- Download button (target) -->
    <g>
      <rect x="170" y="206" width="140" height="34" rx="9" fill="#facc15"/>
      <text x="240" y="228" class="s" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">⬇ Télécharger le QR</text>
    </g>

    <!-- success check fades in after click -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.6;0.66;0.72;0.92;1" dur="3.4s" repeatCount="indefinite"/>
      <circle cx="360" cy="223" r="13" fill="#16a34a"/>
      <path d="M354 223 l4 4 l8 -9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- cursor -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="120,130; 120,130; 240,222; 240,222; 240,222; 300,160"
        keyTimes="0;0.15;0.5;0.58;0.72;1" dur="3.4s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <circle cx="0" cy="0" r="4" fill="#facc15" opacity="0">
        <animate attributeName="r" values="0;0;16" keyTimes="0;0.55;0.66" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.5;0" keyTimes="0;0.55;0.58;0.66" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 0 L0 18 L5 13 L9 21 L12 20 L8 12 L15 12 Z" fill="#1a1a1a" stroke="#fff" stroke-width="1.2"/>
    </g>
  </g>
</svg>

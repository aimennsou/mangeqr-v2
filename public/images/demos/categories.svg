<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Ajouter un plat">
  <defs>
    <clipPath id="c-card"><rect width="480" height="260" rx="14"/></clipPath>
    <style>.t{font-family:Georgia,serif}.s{font-family:system-ui,Arial,sans-serif}</style>
  </defs>
  <g clip-path="url(#c-card)">
    <rect width="480" height="260" fill="#faf7f2"/>
    <text x="28" y="42" class="t" font-size="22" fill="#1a1a1a">Catégories &amp; plats</text>
    <line x1="28" y1="56" x2="452" y2="56" stroke="#e7e1d6"/>

    <!-- category header row -->
    <rect x="28" y="70" width="424" height="40" rx="10" fill="#fff" stroke="#eee6d9"/>
    <circle cx="52" cy="90" r="11" fill="#fde68a"/>
    <text x="72" y="95" class="s" font-size="13" font-weight="700" fill="#1a1a1a">Entrées</text>
    <!-- add dish button (target) -->
    <g>
      <rect x="322" y="76" width="118" height="28" rx="8" fill="#facc15"/>
      <text x="381" y="95" class="s" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">+ Ajouter un plat</text>
    </g>

    <!-- existing dish -->
    <rect x="40" y="120" width="400" height="52" rx="10" fill="#fff" stroke="#eee6d9"/>
    <rect x="52" y="130" width="32" height="32" rx="8" fill="#efe7d6"/>
    <rect x="96" y="132" width="120" height="9" rx="4" fill="#d9d1c2"/>
    <rect x="96" y="148" width="180" height="7" rx="3.5" fill="#e7e1d6"/>
    <text x="428" y="150" class="t" font-size="13" fill="#1a1a1a" text-anchor="end">7,50 €</text>

    <!-- new dish fades in after click -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.6;0.66;0.82" dur="3.2s" repeatCount="indefinite"/>
      <rect x="40" y="180" width="400" height="52" rx="10" fill="#fffdf5" stroke="#facc15"/>
      <rect x="52" y="190" width="32" height="32" rx="8" fill="#fde68a"/>
      <rect x="96" y="192" width="140" height="9" rx="4" fill="#caa63a"/>
      <rect x="96" y="208" width="150" height="7" rx="3.5" fill="#e8d79a"/>
      <text x="428" y="210" class="t" font-size="13" fill="#1a1a1a" text-anchor="end">4,50 €</text>
    </g>

    <!-- cursor -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="150,150; 150,150; 381,90; 381,90; 381,90; 240,200"
        keyTimes="0;0.15;0.5;0.58;0.72;1" dur="3.2s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <circle cx="0" cy="0" r="4" fill="#facc15" opacity="0">
        <animate attributeName="r" values="0;0;16" keyTimes="0;0.55;0.66" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.5;0" keyTimes="0;0.55;0.58;0.66" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 0 L0 18 L5 13 L9 21 L12 20 L8 12 L15 12 Z" fill="#1a1a1a" stroke="#fff" stroke-width="1.2"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Créer un restaurant">
  <defs>
    <clipPath id="r-card"><rect x="0" y="0" width="480" height="260" rx="14"/></clipPath>
    <style>
      .t{font-family:Georgia,'Times New Roman',serif}
      .s{font-family:system-ui,Arial,sans-serif}
    </style>
  </defs>
  <g clip-path="url(#r-card)">
    <rect width="480" height="260" fill="#faf7f2"/>
    <!-- header -->
    <text x="28" y="46" class="t" font-size="26" fill="#1a1a1a">Restaurants</text>
    <text x="28" y="68" class="s" font-size="12" fill="#8a8378">Gérez les établissements de votre compte.</text>
    <line x1="28" y1="84" x2="452" y2="84" stroke="#e7e1d6"/>

    <!-- "Add restaurant" button (target) -->
    <g>
      <rect x="316" y="26" width="136" height="38" rx="10" fill="#facc15"/>
      <rect id="r-ripple" x="316" y="26" width="136" height="38" rx="10" fill="#000" opacity="0">
        <animate attributeName="opacity" values="0;0;0.18;0" keyTimes="0;0.55;0.62;0.75" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="384" y="50" class="s" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">+ Ajouter</text>
    </g>

    <!-- placeholder rows -->
    <rect x="28" y="104" width="424" height="44" rx="10" fill="#fff" stroke="#eee6d9"/>
    <circle cx="52" cy="126" r="12" fill="#efe7d6"/>
    <rect x="74" y="118" width="120" height="8" rx="4" fill="#d9d1c2"/>
    <rect x="74" y="132" width="80" height="7" rx="3.5" fill="#e7e1d6"/>

    <rect x="28" y="156" width="424" height="44" rx="10" fill="#fff" stroke="#eee6d9"/>
    <circle cx="52" cy="178" r="12" fill="#efe7d6"/>
    <rect x="74" y="170" width="150" height="8" rx="4" fill="#d9d1c2"/>
    <rect x="74" y="184" width="96" height="7" rx="3.5" fill="#e7e1d6"/>

    <!-- newly-added row fades in after the click -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.62;0.66;0.8" dur="3s" repeatCount="indefinite"/>
      <rect x="28" y="208" width="424" height="40" rx="10" fill="#fffdf5" stroke="#facc15"/>
      <circle cx="52" cy="228" r="11" fill="#fde68a"/>
      <rect x="72" y="221" width="110" height="8" rx="4" fill="#caa63a"/>
      <rect x="72" y="234" width="70" height="7" rx="3.5" fill="#e8d79a"/>
    </g>

    <!-- animated cursor: idle → move to button → click → settle -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="120,210; 120,210; 384,45; 384,45; 384,45; 200,120"
        keyTimes="0;0.15;0.5;0.58;0.72;1" dur="3s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <!-- click pulse -->
      <circle cx="0" cy="0" r="4" fill="#facc15" opacity="0">
        <animate attributeName="r" values="0;0;16" keyTimes="0;0.55;0.65" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.5;0" keyTimes="0;0.55;0.58;0.66" dur="3s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 0 L0 18 L5 13 L9 21 L12 20 L8 12 L15 12 Z" fill="#1a1a1a" stroke="#fff" stroke-width="1.2"/>
    </g>
  </g>
</svg>

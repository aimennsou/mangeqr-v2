<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Ajouter un menu">
  <defs>
    <clipPath id="m-card"><rect width="480" height="260" rx="14"/></clipPath>
    <style>.t{font-family:Georgia,serif}.s{font-family:system-ui,Arial,sans-serif}</style>
  </defs>
  <g clip-path="url(#m-card)">
    <rect width="480" height="260" fill="#faf7f2"/>
    <text x="28" y="44" class="t" font-size="24" fill="#1a1a1a">Menus</text>
    <line x1="28" y1="60" x2="452" y2="60" stroke="#e7e1d6"/>

    <!-- restaurant select -->
    <rect x="28" y="74" width="180" height="30" rx="8" fill="#fff" stroke="#e0d8c8"/>
    <text x="40" y="93" class="s" font-size="12" fill="#6b6459">Le Bistrot ▾</text>

    <!-- Add menu button (target) -->
    <g>
      <rect x="300" y="72" width="152" height="34" rx="9" fill="#facc15"/>
      <text x="376" y="94" class="s" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">+ Ajouter un menu</text>
    </g>

    <!-- existing menu card -->
    <g>
      <rect x="28" y="120" width="196" height="112" rx="12" fill="#fff" stroke="#eee6d9"/>
      <text x="44" y="146" class="t" font-size="16" fill="#1a1a1a">Menu du Midi</text>
      <rect x="44" y="158" width="46" height="16" rx="8" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="96" y="158" width="46" height="16" rx="8" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="148" y="158" width="46" height="16" rx="8" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="44" y="196" width="140" height="24" rx="8" fill="#facc15"/>
    </g>

    <!-- new menu card fades in after click -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.6;0.66;0.82" dur="3.2s" repeatCount="indefinite"/>
      <rect x="252" y="120" width="196" height="112" rx="12" fill="#fffdf5" stroke="#facc15"/>
      <text x="268" y="146" class="t" font-size="16" fill="#1a1a1a">Menu du Soir</text>
      <rect x="268" y="158" width="46" height="16" rx="8" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="320" y="158" width="46" height="16" rx="8" fill="#dcfce7" stroke="#4ade80"/>
      <rect x="268" y="196" width="140" height="24" rx="8" fill="#facc15"/>
    </g>

    <!-- cursor -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="150,200; 150,200; 376,89; 376,89; 376,89; 320,150"
        keyTimes="0;0.15;0.5;0.58;0.72;1" dur="3.2s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <circle cx="0" cy="0" r="4" fill="#facc15" opacity="0">
        <animate attributeName="r" values="0;0;16" keyTimes="0;0.55;0.66" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.5;0" keyTimes="0;0.55;0.58;0.66" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 0 L0 18 L5 13 L9 21 L12 20 L8 12 L15 12 Z" fill="#1a1a1a" stroke="#fff" stroke-width="1.2"/>
    </g>
  </g>
</svg>
